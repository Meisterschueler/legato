# Hanon, Der Klaviervirtuose, Teil 1 (Nr. 1–20)
#
# Quelle: meisterschueler-gdx, core/src/de/meisterschueler/scorefollower/HanonItemFactory.java
# (GUIDO-Muster, Fingersätze, Stufen), übertragen am 2026-10-26; Fingersätze von Nr. 11, 12 und 16
# (Abwärts) am Original korrigiert.
#
# Daraus erzeugt tools/hanon-musicxml je Übung eine MusicXML-Datei (testdata/legato/hanon/).
#
# Format
# - Tonhöhen der linken Hand in wissenschaftlicher Notation (C4 = eingestrichenes c = MIDI 60), in derselben
#   Lage wie app/assets/pieces/hanon-01.musicxml. Die rechte Hand spielt dieselben Töne eine Oktave höher.
#   meisterschueler-gdx notiert beide Hände eine Oktave höher (GUIDO c0 = MIDI 48 für die linke Hand).
# - Jeder Ton ist eine Sechzehntel; eine Figur füllt einen Takt (8 Töne: 2/4, 16 Töne: 4/4).
# - Ein Abschnitt wird für jede Stufe von `steps.from` bis `steps.to` (Schrittweite ±1) diatonisch in C-Dur
#   versetzt; die Abschnitte folgen in der angegebenen Reihenfolge. `up` ergibt „Aufwärts“, `down` „Abwärts“.
# - `left`, `right`: Fingersatz je Ton der Figur, in allen Stufen gleich.
# - `end`: „Ende“, Grundton der linken Hand über einen ganzen Takt (rechte Hand eine Oktave höher), Finger 5
#   links und 1 rechts. Nicht in meisterschueler-gdx enthalten, ergänzt nach docs/werke/hanon.md.
# - Wiederholungszeichen umschließen „Aufwärts“ und „Abwärts“; „Ende“ folgt danach. Ein Doppelstrich trennt
#   „Aufwärts“ von „Abwärts“ (Wendepunkt), wie im Original.
# - Oberes System im Violin-, unteres im Bassschlüssel. Beide Hände beginnen im unteren System und wechseln
#   ins andere, sobald ein Takt dort weniger Hilfslinien braucht, aber nicht für einen einzelnen Takt. Die
#   Hand ergibt sich aus der Stimme (rechts 1, links 5), nicht aus dem System.
# - `check`: Auffälligkeit beim Übertragen; gegen das Original prüfen, bevor daraus Notentext entsteht.

