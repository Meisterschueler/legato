# Hanon, Der Klaviervirtuose, Teil 1 (Nr. 1–20)
#
# Quelle: meisterschueler-gdx, core/src/de/meisterschueler/scorefollower/HanonItemFactory.java
# (GUIDO-Muster, Fingersätze, Stufen), übertragen am 2026-10-26; Fingersätze von Nr. 11, 12 und 16
# (Abwärts) am Original korrigiert.
#
# Daraus erzeugt tools/exercise-musicxml je Übung eine MusicXML-Datei (testdata/legato/hanon/); das
# Format ist in tools/exercise-musicxml/src/lib.rs beschrieben.
#
# Besonderheiten
# - Tonhöhen in derselben Lage wie app/assets/pieces/hanon-01.musicxml; die rechte Hand spielt dieselben
#   Töne eine Oktave höher. meisterschueler-gdx notiert beide Hände eine Oktave höher (GUIDO c0 = MIDI 48
#   für die linke Hand).
# - C-Dur; jeder Ton ist eine Sechzehntel, eine Figur füllt einen 2/4-Takt (`rhythm = [4, 4]`).
# - `end`: „Ende“, Grundton über einen ganzen Takt, Finger 1 rechts und 5 links. Nicht in
#   meisterschueler-gdx enthalten, ergänzt nach docs/werke/hanon.md.
# - Wiederholungszeichen umschließen „Aufwärts“ und „Abwärts“; „Ende“ folgt danach. Ein Doppelstrich trennt
#   „Aufwärts“ von „Abwärts“ (Wendepunkt), wie im Original.
# - Beide Hände beginnen im unteren System (Bassschlüssel) und wechseln ins obere (Violinschlüssel).

