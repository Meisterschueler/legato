# Brahms, 51 Übungen für das Pianoforte (WoO 6)
#
# Quelle: Angaben des Pianisten zum Notentext, übertragen am 2026-10-26.
#
# Daraus erzeugt tools/exercise-musicxml je Übung eine MusicXML-Datei (testdata/legato/brahms/); das
# Format ist in tools/exercise-musicxml/src/lib.rs beschrieben.
#
# Besonderheiten
# - Die rechte Hand steht im oberen System (beginnt im Violinschlüssel), die linke im unteren (beginnt
#   im Bassschlüssel); die Systeme wechseln den Schlüssel.
# - Offen: Fingersatz, „Ende“, Wiederholungszeichen und Doppelstrich am Wendepunkt; noch nicht erfasst.

work = "51 Exercises"
composer = "Brahms"
change = "clef"

[[exercise]]
number = "1a"
fifths = 2

[[exercise.up]]
right = { notes = "F#4 D4 A3 F#3 G3 A3 B3 C#4 D4 E4 F#4", rhythm = [3, 4, 4] }
left = { notes = "D2 F#2 A2 D3 C#3 B2 A2 G2 F#2", rhythm = [3, 3, 3] }
steps = { from = 0, to = 13 }

[[exercise.down]]
right = { notes = "F#6 D6 A5 F#5 G5 A5 B5 C#6 D6", rhythm = [3, 3, 3] }
left = { notes = "D4 F#4 A4 D5 C#5 B4 A4 G4 F#4 E4 D4", rhythm = [3, 4, 4] }
steps = { from = 0, to = -13 }
