name: legato
description: "Legato - practice companion for pianists."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  webview_flutter: ^4.14.1
  wakelock_plus: ^1.8.2
  path_provider: ^2.1.6
  file_selector: ^1.1.0
  legato_app:
    path: rust_builder
  flutter_rust_bridge: 2.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/pieces/
    - assets/warning.wav
    # Built by score-view-web (npm run build); in CI downloaded from the web job.
    - assets/score-view-web/
