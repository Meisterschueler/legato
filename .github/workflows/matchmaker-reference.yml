name: Matchmaker reference

# Generates testdata/matchmaker/ from the fixed Matchmaker commit (contracts/matchmaker-referenz.md).
on:
  workflow_dispatch:
  # Dispatch only works for workflows on the default branch; a change to the tool runs it, too.
  push:
    paths:
      - tools/matchmaker-reference/pyproject.toml
      - tools/matchmaker-reference/generate.py
      - .github/workflows/matchmaker-reference.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no major-version tags.
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Generate
        working-directory: tools/matchmaker-reference
        run: uv run --python 3.12 generate.py
      - name: Commit
        run: |
          git add testdata/matchmaker tools/matchmaker-reference/uv.lock
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(core): Matchmaker-Referenzdaten erzeugen (T032, T034)"
          git push
