name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # On branches every push is built to the end so slow jobs still report.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FRB_VERSION: 2.13.0

jobs:
  # Generates what cannot be produced locally (platform folders, bindings, lock files).
  # On push the result is committed back; on pull requests it is only checked.
  generate:
    # Pull requests from this repository are already built by the push event.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: rustup toolchain install
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: taiki-e/install-action@v2
        with:
          tool: flutter_rust_bridge_codegen@${{ env.FRB_VERSION }},cbindgen@0.29.4
      - name: Flutter platform folders
        working-directory: app
        run: |
          if [ ! -d ios ]; then
            flutter create --org io.github.meisterschueler --project-name legato \
              --platforms ios,android,macos,windows,linux .
          fi
      - name: flutter_rust_bridge integration
        working-directory: app
        run: |
          if [ ! -d rust_builder ]; then
            flutter_rust_bridge_codegen integrate --rust-crate-name legato_app \
              --rust-crate-dir rust --no-write-lib --no-integration-test
          fi
      - name: flutter_rust_bridge bindings unchanged?
        id: frb-stamp
        uses: actions/cache@v6
        with:
          path: ~/.frb-stamp
          key: frb-${{ env.FRB_VERSION }}-${{ hashFiles('app/rust/src/api/**', 'app/flutter_rust_bridge.yaml', 'Cargo.lock') }}
      - if: steps.frb-stamp.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
      - name: flutter_rust_bridge bindings
        if: steps.frb-stamp.outputs.cache-hit != 'true'
        working-directory: app
        run: |
          if [ -f flutter_rust_bridge.yaml ]; then
            flutter_rust_bridge_codegen generate
          fi
          touch ~/.frb-stamp
      - name: C header of the native MIDI interface
        run: |
          (cd engine && cbindgen --config cbindgen.toml --output include/legato_midi.h)
          cp engine/include/legato_midi.h native/apple/LegatoMidi/Sources/LegatoEngineC/include/
      # No local Rust/Dart toolchain: formatting happens here (on pull requests it is only checked).
      - name: Format
        run: |
          cargo fmt --all
          (cd app && dart format lib test)
      - name: Lock files
        run: |
          cargo metadata --format-version 1 > /dev/null
          (cd app && flutter pub get)
          (cd score-view-web && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
      - name: Commit generated files
        id: commit
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git status --short
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::error::Generated files are out of date"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: erzeugte Dateien aktualisieren"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  rust:
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.generate.outputs.sha }}
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: rustup toolchain install && rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: legato-core for WebAssembly
        run: cargo build -p legato-core --target wasm32-unknown-unknown --locked

  rust-windows:
    needs: generate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.generate.outputs.sha }}
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p legato-core -p legato-engine --locked

  web:
    needs: generate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: score-view-web
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.generate.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: score-view-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: score-view-web
          path: app/assets/score-view-web
          if-no-files-found: error
          retention-days: 14

  flutter:
    needs: [generate, web]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.generate.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: score-view-web
          path: app/assets/score-view-web
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libasound2-dev
      - run: rustup toolchain install
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build linux --debug
      # tar keeps the executable bits that a zip artifact would lose.
      - run: tar -czf legato-linux-x64-debug.tar.gz -C build/linux/x64/debug bundle
      - uses: actions/upload-artifact@v7
        with:
          path: app/legato-linux-x64-debug.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 14

  android:
    needs: [generate, web]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.generate.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: score-view-web
          path: app/assets/score-view-web
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            app/android/**/*.gradle.kts
            app/android/gradle/wrapper/gradle-wrapper.properties
            native/android/**/*.gradle.kts
      - run: rustup toolchain install
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      # cargokit builds Rust outside target/, so Swatinem/rust-cache does not apply.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            app/build/legato_app/build
          key: android-cargo-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('**/*.rs') }}
          restore-keys: android-cargo-${{ hashFiles('Cargo.lock') }}-
      - run: flutter build apk --debug --target-platform android-arm64
      - run: mv build/app/outputs/flutter-apk/app-debug.apk legato-android-arm64-debug.apk
      - uses: actions/upload-artifact@v7
        with:
          path: app/legato-android-arm64-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

  apple:
    needs: [generate, web]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.generate.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: score-view-web
          path: app/assets/score-view-web
      - run: rustup toolchain install
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Swift package (macOS)
        working-directory: native/apple/LegatoMidi
        run: swift build
      - name: Swift package (iOS)
        working-directory: native/apple/LegatoMidi
        run: xcodebuild build -scheme LegatoMidi -destination 'generic/platform=iOS'
      # Profile build with the S2 spike page (debug builds do not start on iOS without a debugger).
      - name: Flutter iOS (spike S2)
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          flutter build ios --profile --no-codesign --dart-define=SPIKE_S2=true
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr legato-s2-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v7
        with:
          path: app/legato-s2-ios-unsigned.ipa
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Flutter macOS
        working-directory: app
        run: |
          flutter build macos --debug
          ditto -c -k --keepParent build/macos/Build/Products/Debug/legato.app legato-macos-debug.zip
      - uses: actions/upload-artifact@v7
        with:
          path: app/legato-macos-debug.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

  # Spike S1 (iOS): unsigned IPA, to be signed and installed with e.g. Sideloadly.
  spike-ios:
    needs: generate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.generate.outputs.sha }}
      - run: rustup toolchain install && rustup target add aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - name: Engine as static library
        run: cargo rustc -p legato-engine --release --locked --target aarch64-apple-ios --crate-type staticlib
      - run: brew install xcodegen
      - name: Build app
        working-directory: spikes/s1-midi-ios
        run: |
          xcodegen generate
          xcodebuild build -project LegatoS1.xcodeproj -scheme LegatoS1 -configuration Release \
            -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/LegatoS1.app Payload/
          zip -qr legato-s1-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v7
        with:
          path: spikes/s1-midi-ios/legato-s1-ios-unsigned.ipa
          archive: false
          if-no-files-found: error
          retention-days: 14

  windows:
    needs: [generate, web]
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.generate.outputs.sha }}
      - run: rustup toolchain install
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: score-view-web
          path: app/assets/score-view-web
      - run: flutter pub get --enforce-lockfile
      # Profile, not debug: debug builds need the debug C runtime of Visual Studio.
      - run: flutter build windows --profile
      - uses: actions/upload-artifact@v7
        with:
          name: legato-windows-x64-profile
          path: app/build/windows/x64/runner/Profile
          if-no-files-found: error
          retention-days: 14
      # Spike S2 on Windows (T106); local builds need Developer Mode for plugin symlinks.
      - run: flutter build windows --profile --dart-define=SPIKE_S2=true
      - uses: actions/upload-artifact@v7
        with:
          name: legato-s2-windows-x64-profile
          path: app/build/windows/x64/runner/Profile
          if-no-files-found: error
          retention-days: 14
