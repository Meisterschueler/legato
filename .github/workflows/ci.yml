name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FRB_VERSION: 2.13.0

jobs:
  # Generates what cannot be produced locally (platform folders, bindings, lock files).
  # On push the result is committed back; on pull requests it is only checked.
  generate:
    # Pull requests from this repository are already built by the push event.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: rustup toolchain install
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: taiki-e/install-action@v2
        with:
          tool: flutter_rust_bridge_codegen@${{ env.FRB_VERSION }}
      - name: Flutter platform folders
        working-directory: app
        run: |
          if [ ! -d ios ]; then
            flutter create --org io.github.meisterschueler --project-name legato \
              --platforms ios,android,macos,windows,linux .
          fi
      - name: flutter_rust_bridge integration
        working-directory: app
        run: |
          if [ ! -d rust_builder ]; then
            flutter_rust_bridge_codegen integrate --rust-crate-name legato_app \
              --rust-crate-dir rust --no-write-lib --no-integration-test
          fi
      - name: flutter_rust_bridge bindings
        working-directory: app
        run: |
          if [ -f flutter_rust_bridge.yaml ]; then
            flutter_rust_bridge_codegen generate
          fi
      - name: Lock files
        run: |
          cargo metadata --format-version 1 > /dev/null
          (cd app && flutter pub get)
          (cd score-view-web && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
      - name: Commit generated files
        id: commit
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git status --short
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::error::Generated files are out of date"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update generated files"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  rust:
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.generate.outputs.sha }}
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: rustup toolchain install && rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: legato-core for WebAssembly
        run: cargo build -p legato-core --target wasm32-unknown-unknown --locked

  rust-windows:
    needs: generate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.generate.outputs.sha }}
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p legato-core -p legato-engine --locked

  web:
    needs: generate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: score-view-web
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.generate.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: score-view-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  flutter:
    needs: generate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.generate.outputs.sha }}
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libasound2-dev
      - run: rustup toolchain install
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build linux --debug

  android:
    needs: generate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.generate.outputs.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: rustup toolchain install
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --debug --target-platform android-arm64

  apple:
    needs: generate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.generate.outputs.sha }}
      - run: rustup toolchain install
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Swift package (macOS)
        working-directory: native/apple/LegatoMidi
        run: swift build
      - name: Swift package (iOS)
        working-directory: native/apple/LegatoMidi
        run: xcodebuild build -scheme LegatoMidi -destination 'generic/platform=iOS'
      - name: Flutter iOS
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          flutter build ios --debug --no-codesign
      - name: Flutter macOS
        working-directory: app
        run: flutter build macos --debug

  windows:
    needs: generate
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.generate.outputs.sha }}
      - run: rustup toolchain install
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build windows --debug
